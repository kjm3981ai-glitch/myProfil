<!doctype html>
<html lang="ko">
<body style="margin:0;padding:0;background:#f4f7fb;font-family:Arial,'Noto Sans KR',sans-serif;color:#14213d;">
  <div style="max-width:640px;margin:0 auto;padding:24px 16px;">
    <div style="overflow:hidden;border-radius:18px;background:#ffffff;box-shadow:0 8px 28px rgba(20,33,61,.12);">
      <div style="padding:28px;background:#14213d;color:#ffffff;">
        <p style="margin:0 0 8px;font-size:12px;font-weight:700;letter-spacing:1px;color:#9db9ff;">NEW INQUIRY</p>
        <h1 style="margin:0;font-size:24px;line-height:1.4;">기업교육 문의가 접수되었습니다</h1>
      </div>
      <div style="padding:28px;">
        <p style="margin:0 0 20px;font-size:16px;line-height:1.7;"><strong>{{from_name}}</strong>님이 <strong>{{inquiry_type}}</strong> 문의를 남겼습니다.</p>
        <table role="presentation" style="width:100%;border-collapse:collapse;font-size:14px;line-height:1.6;">
          <tr><th style="width:120px;padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;">이름</th><td style="padding:11px 12px;border:1px solid #dde3ec;">{{from_name}}</td></tr>
          <tr><th style="padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;">이메일</th><td style="padding:11px 12px;border:1px solid #dde3ec;"><a href="mailto:{{from_email}}" style="color:#1e5eff;">{{from_email}}</a></td></tr>
          <tr><th style="padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;">연락처</th><td style="padding:11px 12px;border:1px solid #dde3ec;">{{phone}}</td></tr>
          <tr><th style="padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;">소속</th><td style="padding:11px 12px;border:1px solid #dde3ec;">{{company}}</td></tr>
          <tr><th style="padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;">문의 유형</th><td style="padding:11px 12px;border:1px solid #dde3ec;">{{inquiry_type}}</td></tr>
          <tr><th style="padding:11px 12px;border:1px solid #dde3ec;background:#f6f8fc;text-align:left;vertical-align:top;">문의 내용</th><td style="padding:11px 12px;border:1px solid #dde3ec;white-space:pre-wrap;">{{message}}</td></tr>
        </table>
        <p style="margin:24px 0 16px;"><a href="mailto:{{from_email}}?subject=Re:%20{{inquiry_type}}%20문의%20답변" style="display:inline-block;padding:13px 18px;border-radius:8px;background:#1e5eff;color:#ffffff;text-decoration:none;font-weight:700;">문의자에게 회신하기</a></p>
        <table role="presentation" style="width:100%;border-collapse:collapse;font-size:12px;color:#647086;line-height:1.6;">
          <tr><td style="padding:7px 0;border-top:1px solid #dde3ec;">접수 시각</td><td style="padding:7px 0;border-top:1px solid #dde3ec;text-align:right;">{{submitted_at}}</td></tr>
          <tr><td style="padding:7px 0;border-top:1px solid #dde3ec;">유입 페이지</td><td style="padding:7px 0;border-top:1px solid #dde3ec;text-align:right;word-break:break-all;">{{page_url}}</td></tr>
          <tr><td style="padding:7px 0;border-top:1px solid #dde3ec;">개인정보 동의</td><td style="padding:7px 0;border-top:1px solid #dde3ec;text-align:right;">{{privacy_agreed}} · {{agreed_at}}</td></tr>
        </table>
      </div>
    </div>
  </div>
</body>
</html>
